services:
  mongodb:
    image: mongo:7
    container_name: fmis-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fmis

  backend:
    build: ./backend
    container_name: fmis-backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/fmis
      DB_NAME: fmis
      PORT: 5000
      JWT_SECRET: change-me-in-production
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: fmis-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
